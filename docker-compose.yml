# `docker compose up -d` is the whole setup story.
#
# Postgres: one instance, one database, one shared schema for every arm.
# Neo4j: one container, for Arm D. A second graph system would need its own
# container -- Neo4j Community allows only one user database per instance.

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: memeval-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-memeval}
      POSTGRES_USER: ${POSTGRES_USER:-memeval}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-memeval}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-memeval} -d ${POSTGRES_DB:-memeval}"]
      interval: 5s
      timeout: 5s
      retries: 10

  neo4j-armd:
    image: neo4j:5-community
    container_name: memeval-neo4j-armd
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_ARMD_USER:-neo4j}/${NEO4J_ARMD_PASSWORD:-memevalgraph}
      # Thousands of nodes, not millions.
      NEO4J_server_memory_heap_max__size: 512M
      NEO4J_server_memory_heap_initial__size: 512M
    ports:
      - "${NEO4J_ARMD_HTTP_PORT:-7474}:7474"
      - "${NEO4J_ARMD_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4j_armd_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15

volumes:
  pgdata:
  neo4j_armd_data: